<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
        }
        #header {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        #subHeader {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        #subHeader div {
            flex: 1;
            padding: 12px 16px;
            background: #e5efff;
            color: #1a3d7c;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        #subHeader div:hover {
            background: #c7dbff;
            transform: translateY(-2px);
        }
        #content p {
            margin: 0 0 15px;
            line-height: 1.6;
        }
        #content div {
            margin: 8px 0;
            padding: 16px;
            border-radius: 10px;
            background: #f7f9fc;
            border: 1px solid #dce4ee;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        #content div:hover {
            background: #dae2f5;
            border-color: #a7b8d8;
        }
        #content1 { background: #dd2828; }
        #content2 { background: #d9f0fc; }
        #content3 { background: #d9fcd9; }
        #content4 { background: #f9ebd9; }
    </style>
</head>
<body>
    <div>
        <div id="header">
            <h1>Project 1</h1>
            <div id="subHeader">
                <div id="button1"> Page 1</div>
                <div id="button2"> page 2</div>
            </div>
            <div id="content">
                <p>click on any content all background colour will chat according to content box colour </p>
                <div id="content1">Content 1</div>
                <div id="content2">Content 2</div>
                <div id="content3">Content 3</div>
                <div id="content4">Content 4</div>
            </div>
        </div>
    </div>
    <script>
        const boxes = document.querySelectorAll("#content > div");
        const page = document.body;
        const boxColors = [
            "#dd2828",
            "#3d8bfd",
            "#47b14c",
            "#f0a500"
        ];

        boxes.forEach((box, index) => {
            box.style.background = boxColors[index];
            box.addEventListener("click", () => {
                page.style.background = boxColors[index];
                boxes.forEach((item, idx) => {
                    item.style.background = boxColors[idx];
                });
            });
        });
    </script>
</body>
</html>
